<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch</title>
    <meta name="earthseed-key" content="pk_Am-UpPEuGCt5dsnR8xqzOFX2mEYDSCeMGrDWxXli4LU" />
    <!-- @moq/net loaded directly from its pinned published package (verify upstream):
         https://www.npmjs.com/package/@moq/net/v/0.1.5 -->
    <script type="importmap">
      { "imports": { "@moq/net": "https://esm.sh/@moq/net@0.1.5" } }
    </script>
    <style>
      body { margin: 0; background: #fff; color: #000; font-family: system-ui, -apple-system, Arial, sans-serif; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 16px; }
      canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 72vh; background: #000; border: 1px solid #ccc; }
      #status { color: #444; font-size: 0.9rem; margin-top: 8px; }
      .home { display: inline-block; margin-bottom: 12px; color: #555; font-size: 0.85rem; text-decoration: none; }
      .home:hover { color: #000; }
      .hint { color: #777; font-size: 0.85rem; margin-top: 4px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
      input { flex: 1; min-width: 180px; padding: 9px 10px; border: 1px solid #999; font: inherit; }
      button { padding: 9px 16px; border: 1px solid #000; background: #fff; color: #000; font: inherit; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      #passcode { font-family: ui-monospace, monospace; font-size: 1.05rem; letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="home" href="/">← earthseed</a>
      <h1>Watch</h1>
      <canvas id="video"></canvas>
      <div id="status">Loading…</div>
      <!-- Shown only if frames fail to decrypt, which is how this page learns a passcode is needed:
           nothing is asked of any server, the AES-GCM tag simply doesn't validate. -->
      <div class="row" id="pcrow" hidden>
        <input id="passcode" type="text" placeholder="passcode from the broadcaster"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Passcode" />
        <button id="pcgo">Unlock</button>
      </div>
      <div class="hint">Tap the video to unmute.</div>
    </div>
    <!-- Our whole client — readable, unminified, open source:
         https://github.com/erikherz/earthseed/blob/main/simple/earthseed.js -->
    <script type="module">
      import { runWatch } from "./earthseed.js";
      runWatch();
    </script>
  </body>
</html>
